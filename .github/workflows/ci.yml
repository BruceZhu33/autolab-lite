name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run pytest -q --ignore=tests/e2e_local
      - run: uv run python eval/agent/run.py --tasks all --out eval/agent/reports/latest.md

  runner-py310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.10
      - run: uv run --locked --python 3.10 --package autolab-runner --with "pytest>=8.0" --with "httpx>=0.27" --with "jsonschema>=4.21" python -c "import sys; assert sys.version_info[:2] == (3, 10), sys.version"
      - run: uv run --locked --python 3.10 --package autolab-runner --with "pytest>=8.0" --with "httpx>=0.27" --with "jsonschema>=4.21" pytest runner/tests packages/protocol -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci && npx tsc --noEmit && npm run build

  e2e-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --all-packages
      - run: |
          if [ ! -f apps/web/.next/BUILD_ID ]; then
            cd apps/web && npm ci && npm run build
          fi
      - run: uv run pytest tests/e2e_local -q
