[project]
name = "autolab-control"
version = "0.1.0"
description = "AutoLab Control: SQLite transaction layer, scheduler, runner transport"
requires-python = ">=3.10"
dependencies = [
    "autolab-protocol",
    "fastapi>=0.110",
    "httpx>=0.27",
    "paramiko>=3.4",
    "pydantic>=2.5",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]

[project.scripts]
autolab-control = "autolab_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autolab_control"]
