              properties:
                expected_state_revision: {type: integer}
              required:
              - expected_state_revision
      responses:
        "200": {description: 已确认（FROZEN）}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

