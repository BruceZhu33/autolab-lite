# =====================================================================
# AutoLab · sidecar OpenAPI v1 契约（M1 四件套之一）
# 版本：v1.0-draft.6（第五轮评审修订版） · 2026-09-13
# 基线：技术设计 v2.7 §6 · 需求 v0.5.3 · 选型 v2.2
# 通用语义（全端点）：
#   1. capability token：除 GET /healthz 外全部 API 必持有效 token（B2；loopback 随机端口）
#   2. 幂等键：所有非只读 POST 支持/要求 Idempotency-Key 头（服务端在业务事务内写
#      api_idempotency 记录请求 hash 与原始响应；同键同载荷→重放原响应；同键异载荷→
#      409 IDEMPOTENCY_CONFLICT）；唯一例外 POST /api/v1/uploads（二进制不缓存响应，按
#      文件 sha256 天然幂等）——复审 S8
#   3. 乐观锁：状态迁移操作携带 expected_state_revision；不匹配→409 STATE_REVISION_CONFLICT
#   4. 错误体统一 AlError{code,message,request_id,details}；request_id 全链路贯穿
#   5. gpu-agent 对外 API（设计 §5）不在本文件——独立进程、SSH 隧道内、不同鉴权（manifest HMAC）
#   6. WS 事件流（/ws）见 ws-events.md（OpenAPI 3.1 不覆盖 WS 语义）
# =====================================================================
openapi: 3.1.0
info:
  title: AutoLab sidecar API
  version: 1.0.0-draft.6
  description: |
    科研训练自动化桌面应用的本机控制面 API（Tauri 壳内前端 ↔ Python sidecar）。
    所有路径以 /api/v1 为统一前缀（健康检查除外）。
    统一标识：request_id / run_id / attempt_id / event_seq（设计 §6）。
servers:
- url: http://127.0.0.1:{port}
  description: sidecar 仅绑定本机回环随机端口（D46/B2；端口由 Tauri 壳注入）
  variables:
    port: {default: "0", description: 随机端口}

security:
- capabilityToken: []

tags:
- {name: System, description: 健康与元信息}
- {name: Servers, description: 服务器/GPU 注册与管理（P1/P2）}
- {name: Projects, description: 立项与项目生命周期（P3）}
- {name: Data, description: 数据版本与副本校验（D16/D39）}
- {name: Plan, description: '方案评审、协议冻结与修订（P4/D21/D38/D43）。[BLOCKED-ADD-4：逐模块 thread/turn 对话流、反问清单逐项确认 API 待设计增补 ADD-4 冻结]'}
- {name: Iteration, description: 训练闭环控制与观测（P5/D23/D31/D32/D41）}
- {name: Budget, description: 预算账本与下调（V6 双返回语义）}
- {name: Evaluation, description: 可信评测、候选与批次（D29/D34/D36/D37/D45）}
- {name: FinalConfirmation, description: test 结果一次性释放（U3 原子语义）}
- {name: Reports, description: 阶段/最终报告与复现包（Q05/A06/D28）}
- {name: Audit, description: 审计与状态回放（设计 §4 迁移留痕）}

paths:
  /healthz:
    get:
      tags: [System]
      summary: 健康检查（唯一免 token 端点）
      security: []
      operationId: getHealthz
      responses:
        "200":
          description: sidecar 存活
          content:
            application/json:
              schema:
                type: object
                required: [status, schema_ver, app_ver]
                properties:
                  status: {const: ok}
                  schema_ver: {type: integer, description: DB schema_migrations 最大版本（启动握手）}
                  app_ver: {type: string}
  /api/v1/meta:
    get:
      tags: [System]
      summary: 版本与能力元信息
      operationId: getMeta
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version: {const: "1"}
                  design_baseline: {type: string, example: "v2.7"}
                  requirements_baseline: {type: string, example: "v0.5.3"}
                  plan_schema: {type: string, example: "plan.schema.json@1"}
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =================================================================
  # Servers（P1/P2）
  # =================================================================
  /api/v1/servers:
    get:
      tags: [Servers]
      summary: 服务器列表（含 agent 能力/沙箱策略探测结果）
      operationId: listServers
      responses: {"200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Server"}}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      tags: [Servers]
      summary: 登记服务器（SSH 直连，D14）
      operationId: createServer
      parameters: [$ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, host, username, auth]
              properties:
                name: {type: string}
                host: {type: string}
                port: {type: integer, default: 22}
                username: {type: string}
                auth:
                  type: object
                  required: [kind, credential_ref]
                  properties:
                    kind: {enum: [password, key]}
                    credential_ref: {type: string, description: 平台钥匙串引用（D48 适配器）}
      responses:
        "201": {description: 已登记, content: {application/json: {schema: {$ref: "#/components/schemas/Server"}}}}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/servers/{serverId}:
    parameters: [$ref: "#/components/parameters/ServerId"]
    get:
      tags: [Servers]
      summary: 服务器详情
      operationId: getServer
      responses: {"200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Server"}}}}, "404": {$ref: "#/components/responses/NotFound"}, '401': {$ref: '#/components/responses/Unauthorized'}}
    patch:
      tags: [Servers]
      summary: 更新登记（凭据变更后须重新验证连接；失联任务记录保留，A11）
      operationId: updateServer
      parameters: [$ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                host: {type: string}
                port: {type: integer}
                auth: {type: object}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Server"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Servers]
      summary: 注销服务器（前置：无该项目在途任务，否则 409）
      operationId: deleteServer
      responses:
        "204": {description: 已注销}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/servers/{serverId}/connectivity-test:
    post:
      tags: [Servers]
      summary: 一键连通性测试（SSH+隧道）
      operationId: testServerConnectivity
      parameters: [$ref: "#/components/parameters/ServerId", $ref: "#/components/parameters/IdempotencyKey"]
      responses:
        "200":
          description: 测试结果
          content:
            application/json:
              schema:
                type: object
                required: [reachable]
                properties:
                  reachable: {type: boolean}
                  detail: {type: string}
                  checked_at: {type: string, format: date-time}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '503':
          $ref: '#/components/responses/AgentUnreachable'
      x-remote-agent-operation: true
  /api/v1/servers/{serverId}/agent:
    get:
      tags: [Servers]
      summary: 最近一次 gpu-agent /healthz 探测缓存（能力清单+沙箱策略 hash；缺沙箱=诊断模式 Z1）
      operationId: getServerAgent
      parameters: [$ref: "#/components/parameters/ServerId"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_ver: {type: string}
                  schema_ver: {type: string}
                  capabilities: {type: object, additionalProperties: true}
                  sandbox_policy_hash: {type: string}
                  diagnostic_only: {type: boolean, description: 无 systemd 沙箱能力时 true（不产 trusted 指标）}
                  sudo_verified: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/servers/{serverId}/agent/probe:
    post:
      tags: [Servers]
      summary: 主动探测 gpu-agent
      operationId: probeServerAgent
      parameters: [$ref: "#/components/parameters/ServerId", $ref: "#/components/parameters/IdempotencyKey"]
      responses:
        "200": {description: 探测完成（结果同 GET /agent）, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        "503": {$ref: "#/components/responses/AgentUnreachable"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

      x-remote-agent-operation: true
  /api/v1/servers/{serverId}/gpus:
    get:
      tags: [Servers]
      summary: 该机 GPU 状态（占用区分 平台任务/外部进程，A03）
      operationId: listServerGpus
      parameters: [$ref: "#/components/parameters/ServerId"]
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Gpu"}}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/servers/{serverId}/environments:
    get:
      tags: [Servers]
      summary: 已装环境版本列表（版本管理，D40）
      operationId: listServerEnvironments
      parameters: [$ref: "#/components/parameters/ServerId"]
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/EnvironmentVersion"}}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/gpus:
    get:
      tags: [Servers]
      summary: 全局卡视图（P2 勾卡数据源；含占用项目归属）
      operationId: listGpus
      parameters:
      - {name: occupancy, in: query, schema: {enum: [all, idle, busy_platform, busy_external]}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Gpu"}}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =================================================================
  # Projects（P3）
  # =================================================================
  /api/v1/projects:
    get:
      tags: [Projects]
      summary: 项目列表
      operationId: listProjects
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Project"}}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: |
        立项：BASE 导入（复制快照，D19）+ GPU 卡池勾选（D15）+ 数据主副本登记（D16）
        + 论文登记（D17）。产出项目档案；状态 INIT。
      operationId: createProject
      parameters: [$ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectCreate"}
      responses:
        "201": {description: 已创建（状态 INIT）, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/projects/{projectId}:
    parameters: [$ref: "#/components/parameters/ProjectId"]
    get:
      tags: [Projects]
      summary: 项目详情（含 status/state_revision/pause_reason/outcome）
      operationId: getProject
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Projects]
      summary: 元数据修改（名称/方向文本；非状态迁移，不动 state_revision 语义）
      operationId: updateProject
      parameters: [$ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                direction_text: {type: string}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/projects/{projectId}/gpu-pool:
    parameters: [$ref: "#/components/parameters/ProjectId"]
    get:
      tags: [Projects]
      summary: 卡池视图（含每卡 VALIDATING/ACTIVE/DRAINING/REMOVED，R11）
      operationId: getProjectGpuPool
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    gpu: {$ref: "#/components/schemas/Gpu"}
                    pool_status: {enum: [VALIDATING, ACTIVE, DRAINING, REMOVED]}
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Projects]
      summary: |
        调整卡池。新增卡须完成校验后才可接单（A11）；移除有在途任务的卡默认
        "停止派发+排空后移除"，仅 mode=force 经用户显式确认才立即终止在途任务（R11）。
      operationId: updateProjectGpuPool
      parameters: [$ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [add_gpu_ids, remove]
              properties:
                add_gpu_ids: {type: array, items: {type: string}}
                remove:
                  type: array
                  items:
                    type: object
                    required: [gpu_id, mode]
                    properties:
                      gpu_id: {type: string}
                      mode: {enum: [drain, force], default: drain}
      responses:
        "200": {description: 已调整, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/projects/{projectId}/env-setup:
    post:
      tags: [Projects]
      summary: 启动远程环境搭建（INIT --start_env_setup--> ENV_SETUP；对卡池每台服务器执行）
      operationId: startEnvSetup
      parameters: [$ref: "#/components/parameters/ProjectId", $ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [expected_state_revision]
              properties:
                expected_state_revision: {type: integer}
                startup_policy: {enum: [full_pool_ready, allowed_subset], default: full_pool_ready, description: R11 启动策略（plan 声明为准）}
      responses:
        "200": {description: 已启动, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '503':
          $ref: '#/components/responses/AgentUnreachable'
      x-remote-agent-operation: true
  /api/v1/projects/{projectId}/env-setup/retry:
    post:
      tags: [Projects]
      summary: 部分失败重试——只修复失败步骤，不影响已就绪部分与在跑任务（A11）
      operationId: retryEnvSetup
      parameters: [$ref: "#/components/parameters/ProjectId", $ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server_ids]
              properties:
                server_ids: {type: array, items: {type: string}}
                steps: {type: array, items: {enum: [code, env, data]}}
      responses:
        "200": {description: 已重试, content: {application/json: {schema: {type: object}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '503':
          $ref: '#/components/responses/AgentUnreachable'
      x-remote-agent-operation: true
  /api/v1/projects/{projectId}/readiness:
    get:
      tags: [Projects]
      summary: 机器就绪状态（每机 code+env+data 三分量，A11）
      operationId: getProjectReadiness
      parameters: [$ref: "#/components/parameters/ProjectId"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    server_id: {type: string}
                    code: {$ref: "#/components/schemas/ReadinessItem"}
                    env: {$ref: "#/components/schemas/ReadinessItem"}
                    data: {$ref: "#/components/schemas/ReadinessItem"}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/projects/{projectId}/papers:
    parameters: [$ref: "#/components/parameters/ProjectId"]
    get:
      tags: [Projects]
      summary: 论文库（解析入库的元数据与结构化内容）
      operationId: listPapers
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Paper"}}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: 论文登记（arXiv/DOI/期刊 URL 自动抓取；失败或本地 PDF 上传兜底，D17）
      operationId: createPaper
      parameters: [$ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: {type: string}
                upload_file_sha256: {type: string, description: 先经 /api/v1/uploads 上传后引用}
      responses:
        "201": {description: 已登记, content: {application/json: {schema: {$ref: "#/components/schemas/Paper"}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/uploads:
    post:
      tags: [System]
      summary: |
        本地文件上传（PDF 等；返回 sha256 供登记引用）。幂等语义例外（S8）：不写
        api_idempotency，重复上传同文件→同 sha256，天然幂等。
      operationId: uploadFile
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema: {type: string}
        description: 不参与服务端幂等（全局语义声明的唯一例外）
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
                purpose: {enum: [paper, base_code_archive]}
      responses:
        "201":
          description: 已接收
          content:
            application/json:
              schema:
                type: object
                required: [sha256, size_bytes]
                properties:
                  sha256: {type: string}
                  size_bytes: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # =================================================================
  # Data（D16/D39）
  # =================================================================
  /api/v1/projects/{projectId}/data-versions:
    parameters: [$ref: "#/components/parameters/ProjectId"]
    get:
      tags: [Data]
      summary: 数据版本列表
      operationId: listDataVersions
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/DataVersion"}}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Data]
      summary: 登记数据主副本并生成清单（文件清单+校验和，D39）
      operationId: createDataVersion
      parameters: [$ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [master_server_id, master_path, logical_name]
              properties:
                master_server_id: {type: string}
                master_path: {type: string}
                logical_name: {type: string}
      responses:
        "201": {description: 已登记（manifest_sha256 生成）, content: {application/json: {schema: {$ref: "#/components/schemas/DataVersion"}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/data-versions/{dataVersionId}/sync:
    post:
      tags: [Data]
      summary: |
        同步到目标服务器：SYNCING→VERIFYING→READY|FAILED（临时位置校验后原子发布；
        运行中副本禁止更新，D39）。rsync 仅 Linux/mac 加速，Windows 走纯 SFTP（D48）。
      operationId: syncDataVersion
      parameters: [$ref: "#/components/parameters/DataVersionId", $ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server_ids]
              properties:
                server_ids: {type: array, items: {type: string}}
      responses:
        "202": {description: 同步任务已受理（进度经 WS 事件 sync.state_changed）}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '503':
          $ref: '#/components/responses/AgentUnreachable'
      x-remote-agent-operation: true
  /api/v1/data-versions/{dataVersionId}/replicas:
    get:
      tags: [Data]
      summary: 副本状态与校验记录
      operationId: listDataReplicas
      parameters: [$ref: "#/components/parameters/DataVersionId"]
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/DataReplica"}}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'

