  /api/v1/projects/{projectId}/repro-package:
    get:
      tags: [Reports]
      summary: |
        可复现代码包（A06 复现绑定：commit+环境版本+配置+数据/划分版本+seed+
        初始化与预训练来源+实际执行命令+硬件与数值精度+plan 版本）。
      operationId: getReproPackage
      parameters: [$ref: "#/components/parameters/ProjectId"]
      responses:
        "200": {description: 包清单与下载引用, content: {application/json: {schema: {type: object}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =================================================================
  # Audit
  # =================================================================
  /api/v1/projects/{projectId}/audit-events:
    get:
      tags: [Audit]
      summary: 审计事件流（LLM 分析/决策/改动全留档可回放）
      operationId: listAuditEvents
      parameters:
      - {$ref: "#/components/parameters/ProjectId"}
      - {name: since, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, default: 100}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/settings/llm:
    get:
      tags:
      - System
      operationId: listLlmSettings
      summary: LLM 供应商与模型按使用点配置（D11/P7：评审对话/每轮分析/自修复/报告四使用点）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - System
      operationId: updateLlmSettings
      summary: 更新 LLM 使用点配置（密钥引用走平台钥匙串，库内不存明文 D30）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/settings/llm/test:
    post:
      tags:
      - System
      operationId: testLlmSettings
      summary: LLM 供应商连通性测试（P7）
      responses:
        '200':
          description: 测试结果
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /api/v1/projects/{projectId}/llm-usage:
    get:
      tags:
      - Audit
      operationId: getProjectLlmUsage
      summary: 项目 token 消耗与成本统计（多供应商，需求 §5 LLM 成本可见）
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/runs/{runId}/retry:
    post:
      tags:
      - Iteration
      operationId: retryFailedRun
      summary: A08 恢复入口：重试失败任务（INFRA_RETRY 重派 / REPAIRING 再试 / METRIC_MISSING 重评）
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_state_revision
              properties:
                expected_state_revision:
                  type: integer
                mode:
                  enum:
                  - redispatch
                  - repair_retry
                  - reevaluate
      responses:
        '200':
          description: 已受理
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AgentUnreachable'
      x-remote-agent-operation: true
  /api/v1/runs/{runId}/resume-from-checkpoint:
    post:
      tags:
      - Iteration
      operationId: resumeRunFromCheckpoint
      summary: A08 恢复入口：从检查点恢复（创建 parent_ckpt 初始化的新 run，D35 加载报告）。guard：ckpt_artifact 须 kind=ckpt 且属于本 run 的 train attempt（D35）；父 run 非 JUDGED/失败态 → 409
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ckpt_artifact_id
              - expected_state_revision
              properties:
                ckpt_artifact_id:
                  type: string
                expected_state_revision:
                  type: integer
                  description: 父 run 状态乐观锁（A2）
      responses:
        '201':
          description: 新 run 已建（PLANNED）
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '503':
          $ref: '#/components/responses/AgentUnreachable'
      x-remote-agent-operation: true
components:
  securitySchemes:
    capabilityToken:
      type: apiKey
      in: header
      name: X-Capability-Token
      description: sidecar 启动时生成；除 /healthz 外全部 API 与 WS 必须（B2）

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: 同键同载荷重放原响应；同键异载荷 409 IDEMPOTENCY_CONFLICT
    ServerId: {name: serverId, in: path, required: true, schema: {type: string}}
    ProjectId: {name: projectId, in: path, required: true, schema: {type: string}}
    DataVersionId: {name: dataVersionId, in: path, required: true, schema: {type: string}}
    ProtocolId: {name: protocolId, in: path, required: true, schema: {type: string}}
    RunId: {name: runId, in: path, required: true, schema: {type: string}}
    EvaluationRequestId: {name: requestId, in: path, required: true, schema: {type: string}}

  responses:
    BadRequest:
      description: "400 VAL_SCHEMA_INVALID / VAL_SEMANTIC_INVALID（如 requested_limit_s ≥ 当前限）"
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: 404 NOT_FOUND
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Conflict:
      description: "409：STATE_REVISION_CONFLICT / STATE_INVALID_TRANSITION / GUARD_UNMET / IDEMPOTENCY_CONFLICT / BUDGET_INSUFFICIENT / BUDGET_DRAINING / FINAL_CONFIRM_ALREADY_RELEASED / FOREIGN_BUSY"
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    TestResultSealed:
      description: 409 TEST_RESULT_SEALED（test 结果仅经 final-confirmation/read 一次性释放）
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    ReductionBelowConsumed:
      description: 422 BUDGET_REDUCTION_BELOW_CONSUMED（新限 < 已消耗 C，历史消耗不可回退）
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    AgentUnreachable:
      description: 503 AGENT_UNREACHABLE
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: 401 AUTH_INVALID_TOKEN（capability token 无效/缺失）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 403 FORBIDDEN（越权操作，如直接创建 scope=test 评测请求）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 422 VAL_SEMANTIC_INVALID（通用语义校验失败）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: {type: string, description: "错误码表：VAL_SCHEMA_INVALID|VAL_SEMANTIC_INVALID|AUTH_INVALID_TOKEN|FORBIDDEN|NOT_FOUND|STATE_REVISION_CONFLICT|STATE_INVALID_TRANSITION|GUARD_UNMET|IDEMPOTENCY_CONFLICT|BUDGET_INSUFFICIENT|BUDGET_DRAINING|BUDGET_REDUCTION_BELOW_CONSUMED|SETTLE_PRECONDITION|AGENT_EVENT_CONFLICT|DATA_REPLICA_NOT_READY|PROJECT_NOT_DISPATCHABLE|TEST_SEALED|FINAL_CONFIRM_ALREADY_RELEASED|GAP_DETECTED|CURSOR_EXPIRED|SNAPSHOT_REQUIRED|AGENT_UNREACHABLE|FOREIGN_BUSY|INTERNAL"}
        message: {type: string}
        request_id: {type: string}
        details:
          type: object
          additionalProperties: true
          description: "如 GUARD_UNMET→{violations:[{guard,reason}]}；STATE_REVISION_CONFLICT→{current_state, current_state_revision}"

    Server:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        host: {type: string}
        port: {type: integer}
        username: {type: string}
        status: {enum: [UNKNOWN, REACHABLE, UNREACHABLE, DECOMMISSIONED]}
        agent_capabilities: {type: object}
        sandbox_policy_hash: {type: string}
        sudo_verified: {type: boolean}
        diagnostic_only: {type: boolean}

    Gpu:
      type: object
      properties:
        id: {type: string}
        server_id: {type: string}
        gpu_index: {type: integer}
        model_name: {type: string}
        vram_mb: {type: integer}
        status: {enum: [UNKNOWN, IDLE, BUSY_PLATFORM, BUSY_EXTERNAL, UNREACHABLE, DRAINED]}
        occupied_by: {type: string, description: BUSY_PLATFORM 时的 attempt_id}
        utilization_pct:
          type: integer
        mem_used_mb:
          type: integer
        telemetry_at:
          type: string
          format: date-time

    EnvironmentVersion:
      type: object
      properties:
        id: {type: string}
        server_id: {type: string}
        ver: {type: integer}
        spec_hash: {type: string}
        status: {enum: [PLANNED, INSTALLING, READY, FAILED]}

    Project:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        direction_text: {type: string}
        base_source_kind: {enum: [github, local]}
        base_source_ref: {type: string}
        status:
          enum: [INIT, ENV_SETUP, REVIEW_GATE, BASELINE_ACCEPTANCE, SEARCH, CONFIRMATION_PREP, CONFIRMATION_RUNNING, TEST_RESULT_SEALED, STOPPING, STOP_PENDING_CONFIRMATION, FINISHING, REPORTING, REPORTED, PAUSED]
        state_revision: {type: integer}
        pause_reason: {type: string}
        paused_from_state: {type: string}
        current_protocol_id: {type: string}
        control_epoch: {type: integer}
        outcome: {enum: [completed, failed, cancelled, budget_exhausted, stopped]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ProjectCreate:
      type: object
      required: [name, direction_text, base_source, gpu_ids, dataset]
      properties:
        name: {type: string}
        direction_text: {type: string}
        base_source:
          type: object
          required: [kind, ref]
          properties:
            kind: {enum: [github, local]}
            ref: {type: string}
        gpu_ids: {type: array, items: {type: string}}
        dataset:
          type: object
          required: [master_server_id, master_path]
          properties:
            master_server_id: {type: string}
            master_path: {type: string}
        paper_urls: {type: array, items: {type: string}}
        paper_upload_sha256: {type: array, items: {type: string}}

    ReadinessItem:
      type: object
      properties:
        status: {enum: [PENDING, SYNCING, VERIFYING, READY, FAILED]}
        detail: {type: string}
        updated_at: {type: string, format: date-time}

    Paper:
      type: object
      properties:
        id: {type: string}
        source_kind: {enum: [url, upload]}
        url: {type: string}
        title: {type: string}
        parsed: {type: object, description: 方法/指标结构化内容}

    DataVersion:
      type: object
      properties:
        id: {type: string}
        project_id: {type: string}
        logical_name: {type: string}
        manifest_sha256: {type: string}
        created_at: {type: string, format: date-time}

    DataReplica:
      type: object
      properties:
        id: {type: string}
        data_version_id: {type: string}
        server_id: {type: string}
        logical_path: {type: string}
        actual_path: {type: string}
        status: {enum: [SYNCING, VERIFYING, READY, FAILED]}
        last_validation: {type: object}

    PlanProtocol:
      type: object
      properties:
        id: {type: string}
        project_id: {type: string}
        parent_id: {type: string}
        ver: {type: integer}
        body_hash: {type: string}
        status: {enum: [DRAFT, FROZEN, SUPERSEDED, INVALIDATED]}
        effective_round: {type: integer}
        created_at: {type: string, format: date-time}
        frozen_at: {type: string, format: date-time}

    PlanBody:
      type: object
      description: experiment_plan 定稿体（校验契约见 plan.schema.json@1，此处透传）
      additionalProperties: true

      x-external-schema: plan.schema.json（客户端模型生成以其为准；OpenAPI 内不内联——复审 O2 部分采纳）
    Split:
      type: object
      required: [name, unit_rule, preprocess_fit_scope]
      properties:
        id: {type: string}
        name: {type: string}
        unit_rule:
          type: object
          required: [independent_unit]
          properties:
            independent_unit: {type: string}
            grouping_rule: {type: string}
            time_rule: {type: string}
        preprocess_fit_scope: {enum: [train_only, declared_exception]}

    SplitValidation:
      type: object
      properties:
        id: {type: string}
        plan_protocol_id: {type: string}
        data_version_id: {type: string}
        split_id: {type: string}
        validator_version: {type: string}
        status: {enum: [RUNNING, PASSED, FAILED]}
        evidence_hash: {type: string}
        validated_at: {type: string, format: date-time}

    EvaluatorSnapshot:
      type: object
      properties:
        id: {type: string}
        project_id: {type: string}
        digest: {type: string}
        frozen_at: {type: string, format: date-time}

    Run:
      type: object
      properties:
        id: {type: string}
        project_id: {type: string}
        round_no: {type: integer}
        role: {enum: [baseline, search, ablation, multi_seed]}
        plan_protocol_id: {type: string}
        code_snapshot_id: {type: string}
        env_version_id: {type: string}
        data_version_id: {type: string}
        recipe_id: {type: string}
        init_spec_id: {type: string}
        candidate_id: {type: string}
        control_epoch: {type: integer}
        status: {type: string, description: run 层状态（state-machine.md §2）}
        state_revision: {type: integer}
        fail_class: {enum: [model, infra, metric, llm]}

    Attempt:
      type: object
      properties:
        id: {type: string}
        run_id: {type: string}
        seq: {type: integer}
        dispatch_id: {type: string}
        evaluation_request_id: {type: string}
        server_id: {type: string}
        gpu_id: {type: string}
        profile: {enum: [train, infer, agg]}
        exec_manifest_hash: {type: string}
        control_epoch: {type: integer}
        budget_reservation_id: {type: string}
        status: {type: string, description: attempt 层状态（state-machine.md §2）}
        state_revision: {type: integer}
        fail_class: {enum: [model, infra, metric, llm]}
        log_tail: {type: string}

    BudgetAccount:
      type: object
      properties:
        project_id: {type: string}
        limit_s: {type: integer}
        status: {enum: [ACTIVE, DRAINING]}
        requested_limit_s: {type: integer, nullable: true}
        drain_started_at: {type: string, nullable: true}
        consumed_s: {type: integer, description: C}
        reserved_s: {type: integer, description: R}
        allocatable_s: {type: integer, description: B−C−R（Q02）}
        revision: {type: integer}

    BudgetReservation:
      type: object
      properties:
        id: {type: string}
        attempt_id: {type: string}
        authorized_s: {type: integer}
        remaining_s: {type: integer}
        status: {enum: [ACTIVE, STOPPING, SETTLED]}
        settle_reason: {enum: [completed, stop_confirmed, hard_deadline, expired, cancelled], nullable: true}
        expires_at: {type: string}

    BudgetReductionResult:
      type: object
      required: [phase, budget]
      properties:
        phase: {enum: [accepted, achieved], description: "accepted=已接受（DRAINING 中）；achieved=已达成（原子完成）"}
        budget: {$ref: "#/components/schemas/BudgetAccount"}
        pending_stops:
          type: array
          description: phase=accepted 时待停止的预留（按 remaining 降序）
          items: {$ref: "#/components/schemas/BudgetReservation"}

    EvaluationRequest:
      type: object
      properties:
        id: {type: string}
        run_id: {type: string}
        scope: {enum: [val, test]}
        plan_protocol_id: {type: string}
        data_version_id: {type: string}
        split_id: {type: string}
        ckpt_artifact_id: {type: string}
        ckpt_expected_sha256: {type: string}
        evaluator_digest: {type: string}
        ckpt_selection_rule_ver: {type: string}
        status: {enum: [QUEUED, INFER_PENDING, INFER_RUNNING, AGG_PENDING, AGG_RUNNING, COMPLETED, FAILED]}

    EvaluationResult:
      type: object
      properties:
        evaluation_request_id: {type: string}
        metric: {type: string}
        value: {type: number}
        evidence_hash: {type: string}
        scope: {enum: [val, test]}
        run_id: {type: string}
        plan_protocol_id: {type: string, description: 附带协议版本（R01 可信来源三要素之一）}
        data_version_id: {type: string}

    FinalReadResult:
      type: object
      required: [release_id, batch_id, outcome, release_payload_hash, released_at]
      properties:
        release_id: {type: string}
        batch_id: {type: string}
        outcome: {enum: [completed, failed], description: 按 plan 预登记最终比较规则判定（Q01）}
        release_payload_hash: {type: string, description: 重放可验证内容未变}
        released_at: {type: string, format: date-time}
        replayed: {type: boolean, description: true=幂等重放（同 Idempotency-Key）}
        final_comparison:
          type: object
          description: 最终比较明细（均值±标准差/区间、样本数、随机源、初筛是否被推翻）
        test_metrics:
          type: array
          items: {$ref: "#/components/schemas/EvaluationResult"}
