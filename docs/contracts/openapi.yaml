  # FinalConfirmation（U3 原子语义）
  # =================================================================
  /api/v1/projects/{projectId}/final-confirmation:
    get:
      tags: [FinalConfirmation]
      summary: 确认状态（不暴露 test 数值——仅齐套进度与可读性）
      operationId: getFinalConfirmationStatus
      parameters: [$ref: "#/components/parameters/ProjectId"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_status: {type: string}
                  batch_id: {type: string}
                  release: {type: object, description: 已释放时返回释放记录摘要（含 payload_hash）}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/projects/{projectId}/final-confirmation/read:
    post:
      tags: [FinalConfirmation]
      summary: |-
        scope=test 读取的唯一入口（原子事务，U3）。[BLOCKED-ADD-2：读取后的新实验版本创建入口与"测试集已参与开发"持久标记待设计增补 ADD-2 冻结] 单事务：幂等优先查询（api_idempotency / test_result_releases）→ 归属闭包关系查询（batch→candidate→selected_run→project→current_protocol）→ guard（required 条目全部 SUCCEEDED，证据不足拒绝）→ 写 test_result_releases（release_payload_json 固定响应体）+ api_idempotency + audit → 项目 CAS 迁移 FINISHING(completed|failed)。同键重试返回持久化响应（replayed=true）；异键二次读→409 FINAL_CONFIRM_ALREADY_RELEASED。
      operationId: readFinalConfirmation
      parameters: [$ref: "#/components/parameters/ProjectId", $ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch_id, expected_state_revision]
              properties:
                batch_id: {type: string}
                expected_state_revision: {type: integer}
      responses:
        "200":
          description: |
            释放成功或幂等重放（同一固定结果）。outcome=completed|failed 按 plan 预登记的
            最终比较与证据规则（Q01）判定——全部到齐不自动等于提升成立。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FinalReadResult"}
        "409":
          description: "GUARD_UNMET（guard 明细）/ STATE_REVISION_CONFLICT / FINAL_CONFIRM_ALREADY_RELEASED（异键重放）"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

