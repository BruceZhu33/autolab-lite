    post:
      tags: [Evaluation]
      summary: |-
        按最终代码重校验（D36）：原矩阵有效→自动 FROZEN；需修订→NEEDS_CONFIRMATION
        →项目 PAUSED(matrix_revision)（R07，P5 显示原因）。
        。服务端由 matrixId→proto→project 解析所属项目并以 expected_state_revision 锁定项目乐观锁（A2）。
      operationId: revalidateAblationMatrix
      parameters:
      - {name: matrixId, in: path, required: true, schema: {type: string}}
      - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: 重校验结果
          content:
            application/json:
              schema:
                type: object
                required: [outcome]
                properties:
                  outcome: {enum: [frozen, needs_confirmation]}
                  invalidated_items: {type: array, items: {type: string}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_state_revision:
                  type: integer
                  description: 乐观锁：客户端持有的项目 state_revision（A2）
              required:
              - expected_state_revision

