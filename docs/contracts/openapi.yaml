                expected_state_revision: {type: integer}
                patch_class: {enum: [none, env_compat, method], description: "Round 0 报错修补的类别；patch_class=method（方法修改，Round 0 禁止）时 verdict 必须 reject 或转 D38 修订——服务端校验（D33）"}
                notes: {type: string, description: 与论文数值差异的可解释性记录}
