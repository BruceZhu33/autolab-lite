  # =================================================================
  # Budget（V6 双返回）
  # =================================================================
  /api/v1/projects/{projectId}/budget:
    get:
      tags: [Budget]
      summary: 账本快照（limit_s/status/consumed_s/reserved_s/revision + 可分配余额 B−C−R）
      operationId: getBudget
      parameters: [$ref: "#/components/parameters/ProjectId"]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BudgetAccount"}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{projectId}/budget/reduction:
    post:
      tags: [Budget]
      summary: |
        预算下调（两阶段，V6）——**双返回语义**：
        · 200 {"phase":"achieved"}：C+R 已满足新限 → 本请求事务内原子完成
          limit_s=requested_limit、账户回 ACTIVE；
        · 202 {"phase":"accepted"}：仍有预留占位 → requested_limit 落库、账户入 DRAINING
          （limit_s 不变、C+R≤旧限恒成立），对最大预留循环发 STOP，结算满足后原子达成
          （WS budget.reduction_settled + GET 本端点可见新 ACTIVE）。
        拒绝：新限 < C（历史消耗不可回退）→ 422 BUDGET_REDUCTION_BELOW_CONSUMED；
        新限 ≥ 当前限 → 400。幂等重放返回原受理结果（当前状态以 GET /budget 为准）。
      operationId: reduceBudget
      parameters: [$ref: "#/components/parameters/ProjectId", $ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_limit_s, expected_budget_revision]
              properties:
                requested_limit_s: {type: integer, exclusiveMinimum: 0}
                expected_budget_revision:
                  type: integer
                  description: 预算账本乐观锁（budget_accounts.revision，T-DRAIN CAS）
      responses:
        "200":
          description: 已达成（achieved——原子完成）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BudgetReductionResult"}
        "202":
          description: 已接受（accepted——DRAINING 进行中，STOP 已发出）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BudgetReductionResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ReductionBelowConsumed"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/projects/{projectId}/budget/reservations:
    get:
      tags: [Budget]
      summary: 预留明细（ACTIVE/STOPPING 继续计入 R；SETTLED 已释放）
      operationId: listBudgetReservations
      parameters: [$ref: "#/components/parameters/ProjectId"]
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/BudgetReservation"}}}}}
