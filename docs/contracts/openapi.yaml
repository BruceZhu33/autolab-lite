  # =================================================================
  # Evaluation（D29/D34/D36/D37/D45）
  # =================================================================
  /api/v1/runs/{runId}/evaluation-requests:
    post:
      tags: [Evaluation]
      summary: |-
        创建可信评测请求（**仅 scope=val**，schema const 机器固定；test 请求由确认流程内部创建，属 sidecar 内部命令域，不经公开 API）。冻结完整评测身份：协议+数据版本+划分+ckpt 摘要+evaluator_digest。
      operationId: createEvaluationRequest
      parameters: [$ref: "#/components/parameters/RunId", $ref: "#/components/parameters/IdempotencyKey"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, data_version_id, split_id, ckpt_artifact_id]
              properties:
                scope:
                  const: val
                  description: 机器固定 val（r3-A1）：scope=test 的评测请求由确认流程内部创建，本公开端点 schema 层拒绝任何其他值——不依赖运行时 403
                data_version_id: {type: string}
                split_id: {type: string}
                ckpt_artifact_id: {type: string}
                ckpt_expected_sha256: {type: string}
      responses:
        "201": {description: 已创建（QUEUED，infer→agg 双步调度）, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationRequest"}}}}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/runs/{runId}/evaluation-results:
    get:
      tags: [Evaluation]
      summary: |-
        可信评测结果（scope=val：正式指标，附 run/数据版本/评测协议版本）。S14：scope=test 数值不存在于本端点——唯一出口为 final-confirmation/read 的固定 payload（重放亦只读 release payload）。
      operationId: getEvaluationResults
      parameters:
      - {$ref: "#/components/parameters/RunId"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/EvaluationResult"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/evaluation-requests/{requestId}:
