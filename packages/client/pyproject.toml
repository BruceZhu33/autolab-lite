[project]
name = "autolab-client"
version = "0.1.0"
description = "autolab CLI and .autolab research workspace tools"
requires-python = ">=3.10"
dependencies = [
    "autolab-protocol",
    "autolab-control",
    "mcp>=1.2",
    "typer>=0.12",
]

[project.scripts]
autolab = "autolab_client.cli:app"
autolab-mcp = "autolab_client.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autolab_client"]
