[project]
name = "autolab-protocol"
version = "0.1.0"
description = "AutoLab v1 contracts: PlanSpec, Manifest, RunnerEvent, Artifact, canonical hashing"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "rfc8785>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autolab_protocol"]
