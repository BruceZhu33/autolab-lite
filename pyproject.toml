[project]
name = "autolab-lite"
version = "0.1.0"
description = "AutoLab Lite: personal GPU experiment workbench (control plane, runner, protocol, CLI)"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[tool.uv.workspace]
members = ["packages/*", "apps/control", "runner"]

[tool.uv.sources]
autolab-protocol = { workspace = true }
autolab-control = { workspace = true }
autolab-client = { workspace = true }
autolab-runner = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "runner", "tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer's argument-default idiom trips B008
"packages/client/autolab_client/cli.py" = ["B008"]
# reuses the test_repo fixture; param name shadows the import on purpose
"apps/control/tests/test_m2_repo.py" = ["F811"]
"apps/control/tests/test_m3_ops.py" = ["F811"]
"apps/control/tests/test_http_api.py" = ["F811"]
