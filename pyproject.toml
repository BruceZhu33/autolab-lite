[project]
name = "autolab-lite"
version = "0.1.0"
description = "AutoLab Lite: personal GPU experiment workbench (control plane, runner, protocol, CLI)"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[tool.uv.workspace]
members = ["packages/*", "apps/control", "runner"]

[tool.uv.sources]
autolab-protocol = { workspace = true }
autolab-control = { workspace = true }
autolab-client = { workspace = true }
autolab-runner = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "runner", "tests", "eval"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的 File()/Form() 是参数默认值惯用法
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# typer's argument-default idiom trips B008
"packages/client/autolab_client/cli.py" = ["B008"]
# 测试复用 fixture:参数名有意与导入的 fixture 同名
"**/tests/*.py" = ["F811"]
