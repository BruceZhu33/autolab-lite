[project]
name = "autolab-runner"
version = "0.1.0"
description = "AutoLab Runner: idempotent job executor for local/GPU servers"
requires-python = ">=3.10"
dependencies = [
    "autolab-protocol",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
autolab-runner = "autolab_runner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autolab_runner"]
