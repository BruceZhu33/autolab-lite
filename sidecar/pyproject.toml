[project]
name = "autolab-sidecar"
version = "0.1.0"
description = "AutoLab 控制端 sidecar（FastAPI + SQLite/WAL，仅绑 127.0.0.1 随机端口 + capability token）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncssh>=2.17",
  "httpx>=0.27",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
